<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonali Mohil</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* RESET */
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', sans-serif;
  background:#fafafa;
  color:#1a1a1a;
  line-height:1.6;
}

/* HEADER */
.site-header {
  position:sticky;
  top:0;
  background:rgba(255,255,255,0.85);
  backdrop-filter: blur(10px);
  z-index:1000;
}
.header-inner {
  max-width:1300px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:1rem 1.2rem;
}
.brand {
  font-family:'Playfair Display', serif;
  font-size:1.4rem;
  text-decoration:none;
  color:#000;
}
.nav {
  display:flex;
  gap:1.5rem;
}
.nav a {
  text-decoration:none;
  color:#333;
  font-weight:400;
  font-size:0.95rem;
}
.nav a:hover { opacity:0.6; }

/* HERO */
.hero {
  height:70vh;
  background:url('images-home/11.jpg') center/cover no-repeat;
  display:flex;
  align-items:flex-end;
}
.hero-inner {
  max-width:1300px;
  margin:auto;
  padding:3rem 1.2rem;
  color:#fff;
}
.hero-inner h1 {
  font-family:'Playfair Display', serif;
  font-size:3rem;
}
.hero-inner p {
  max-width:480px;
  opacity:0.85;
}

/* GALLERY */
.gallery {
  max-width:1300px;
  margin:4rem auto;
  padding:0 1.2rem;
  column-count:3;
  column-gap:2rem;
}

@media (max-width:1024px){
  .gallery{ column-count:2; }
}
@media (max-width:600px){
  .gallery{ column-count:1; }
}

.card {
  break-inside:avoid;
  margin-bottom:2rem;
  position:relative;
  overflow:hidden;
  border-radius:18px;
  background:#000;
}
.card img {
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform 0.6s ease;
}
.card:hover img {
  transform:scale(1.05);
}

.caption {
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:1.2rem;
  background:linear-gradient(to top, rgba(0,0,0,0.6), transparent);
  color:#fff;
  font-size:0.85rem;
  opacity:0;
  transition:opacity 0.4s ease;
}
.card:hover .caption { opacity:1; }

/* FOOTER */
.site-footer {
  text-align:center;
  padding:3rem 1rem;
  font-size:0.85rem;
  color:#666;
}
.site-footer a {
  color:#000;
  text-decoration:none;
  margin:0 0.4rem;
}
</style>
</head>

<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html">Sonali Mohil</a>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="analysis.html">Analysis</a>
      <a href="vlogs.html">Vlogs</a>
      <a href="gallery.html">Gallery</a>
      <a href="about.html">About</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <h1>A Life in Motion</h1>
    <p>Growth, love, support, and quiet strength — curated, not collected.</p>
  </div>
</section>

<main class="gallery" id="gallery"></main>

<footer class="site-footer">
  <p>© <span id="year"></span> Sonali Mohil</p>
  <a href="https://instagram.com/sonalimohil">Instagram</a> ·
  <a href="mailto:mohilsonali@gmail.com">Email</a>
</footer>

<script>
document.getElementById("year").textContent = new Date().getFullYear();

const images = [
  {src:"11.jpg", cap:"Moments that shape me."},
  {src:"2.jpg", cap:"Living with intention."},
  {src:"3.jpg", cap:"Collecting joy, not perfection."},
  {src:"4.jpg", cap:"Growth in every direction."},
  {src:"5.jpg", cap:"Soft strength, steady steps."},
  {src:"6.jpg", cap:"Open heart, clear mind."},
  {src:"7.jpg", cap:"Presence is power."},
  {src:"8.jpg", cap:"Every place taught something."},
  {src:"9.jpg", cap:"Calm in motion."},
  {src:"10.jpg", cap:"A life unfolding."}
];

const gallery = document.getElementById("gallery");

images.forEach(i=>{
  const card=document.createElement("div");
  card.className="card";
  card.innerHTML=`
    <img src="images-home/${i.src}" alt="">
    <div class="caption">${i.cap}</div>`;
  gallery.appendChild(card);
});
</script>

</body>
</html>

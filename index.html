<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonali Mohil</title>

  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="brand">Sonali Mohil</a>
    <nav class="nav">
      <a href="index.html" class="active">Home</a>
      <a href="analysis.html">Analysis</a>
      <a href="vlogs.html">Vlogs</a>
      <a href="gallery.html">Gallery</a>
      <a href="about.html">About</a>
    </nav>
  </div>
</header>

<!-- HERO -->
<section class="hero" style="background-image: url('images-home/1.jpg');">
  <div class="hero-overlay">
    <div class="hero-inner">
      <h1>A Life in Motion</h1>
      <p>Growth, love, support, and positivity guide every step.</p>
    </div>
  </div>
</section>

<!-- MAIN -->
<main class="container">
  <section class="home-vertical" id="gallery-section">
    <!-- Images will load automatically -->
  </section>
</main>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="container footer-inner">
    <p>© <span id="year"></span> Sonali Mohil</p>
    <div class="social">
      <a href="https://instagram.com/sonalimohil" target="_blank">Instagram</a> ·
      <a href="mailto:mohilsonali@gmail.com">Email</a>
    </div>
  </div>
</footer>

<script>
  // Insert current year in footer
  document.getElementById("year").textContent = new Date().getFullYear();

  // Load all images 1.jpg to 10.jpg dynamically
  const gallerySection = document.getElementById("gallery-section");
  const totalImages = 10; // we have 10 images

  for (let i = 1; i <= totalImages; i++) {
    const div = document.createElement("div");
    div.className = "home-image";

    const img = document.createElement("img");
    img.src = `images-home/${i}.jpg`;
    img.alt = `Home image ${i}`;

    const p = document.createElement("p");
    p.className = "soft-quote";
    p.textContent = "Growth, love, support, and positivity fill every moment.";

    div.appendChild(img);
    div.appendChild(p);
    gallerySection.appendChild(div);
  }
</script>

</body>
</html>

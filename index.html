<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonali Mohil</title>

  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="brand">Sonali Mohil</a>
    <nav class="nav">
      <a href="index.html" class="active">Home</a>
      <a href="analysis.html">Analysis</a>
      <a href="vlogs.html">Vlogs</a>
      <a href="gallery.html">Gallery</a>
      <a href="about.html">About</a>
    </nav>
  </div>
</header>

<!-- HERO -->
<section class="hero" style="background-image: url('images-home/62FF466D-D989-462F-91A1-D50EB1DFC3F3.jpg');">
  <div class="hero-overlay">
    <div class="hero-inner">
      <h1>A Life in Motion</h1>
      <p>Growth, love, support, and positivity guide every step.</p>
    </div>
  </div>
</section>

<!-- MAIN -->
<main class="container">
  <section class="home-vertical" id="gallery-section">
    <!-- Images will be loaded automatically by JavaScript -->
  </section>
</main>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="container footer-inner">
    <p>© <span id="year"></span> Sonali Mohil</p>
    <div class="social">
      <a href="https://instagram.com/sonalimohil" target="_blank">Instagram</a> ·
      <a href="mailto:mohilsonali@gmail.com">Email</a>
    </div>
  </div>
</footer>

<script>
  // Set current year in footer
  document.getElementById("year").textContent = new Date().getFullYear();

  // List of all images in images-home folder
  const images = [
    "0B3E3D4D-6E31-46F2-935C-F205A366ADDD.jpg",
    "0DF6AE0E-036A-4386-B7B7-50205143C989.jpg",
    "23066D3A-A6C7-4D66-9076-DC1A1A3F11AD.jpg",
    "244BF773-9459-4CF9-829A-A01006E404CA.jpg",
    "2730B968-3703-4826-BE47-4D19ED92436C.jpg",
    "387CE674-6F3F-4B5B-B413-04E8E2892352.jpg",
    "4A5F409C-6C40-4E3C-8870-89CBF1872D40.jpg",
    "51C7A5BC-13EC-4145-9090-4329B80335C2.jpg",
    "62FF466D-D989-462F-91A1-D50EB1DFC3F3.jpg",
    "6F1A3057-771C-4891-B751-37F3D23CA906.jpg"
  ];

  const gallerySection = document.getElementById("gallery-section");

  // Loop through images and create elements
  images.forEach((filename, index) => {
    const div = document.createElement("div");
    div.className = "home-image";

    const img = document.createElement("img");
    img.src = `images-home/${filename}`;
    img.alt = `Home image ${index + 1}`;

    const p = document.createElement("p");
    p.className = "soft-quote";
    p.textContent = "Growth, love, support, and positivity fill every moment.";

    div.appendChild(img);
    div.appendChild(p);
    gallerySection.appendChild(div);
  });
</script>

</body>
</html>
